name: CI

# Lint, type check and test on every push and pull request.
#
# Publishing lives in release.yml and is deliberately untouched by this
# workflow: CI never uploads anything.

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev tooling
        run: python -m pip install --upgrade pip -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version advertised in the pyproject classifiers.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # autocut shells out to ffmpeg/ffprobe. The integration test drives the
      # real binaries, and skips itself if they are absent — so install them.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Install package and dev tooling
        run: python -m pip install --upgrade pip -e ".[dev]"

      - name: Verify the runtime install pulled no third-party dependencies
        run: |
          python - <<'PY'
          import importlib.metadata as md
          requires = md.requires("trsdn-autocut") or []
          runtime = [r for r in requires if "extra ==" not in r]
          assert runtime == [], f"unexpected runtime dependencies: {runtime}"
          print("runtime dependencies: none (stdlib only)")
          PY

      - name: Console script smoke test
        run: autocut --version

      - name: Pytest
        run: pytest

  package:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check --strict dist/*

      - name: Verify the built wheel installs and runs on its own
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install --no-index dist/*.whl
          /tmp/check/bin/autocut --version
