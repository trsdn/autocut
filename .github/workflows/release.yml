name: Release

# Publishes `trsdn-autocut` to PyPI via Trusted Publishing (OIDC).
# No API tokens or secrets are used — PyPI is configured with a trusted
# publisher for repository trsdn/autocut, workflow release.yml, environment pypi.
#
# Trigger a release by pushing a tag: git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only a tag push publishes. A manual workflow_dispatch run stops after
    # `build`, which makes it a safe dry run: PyPI rejects re-uploading a
    # version that already exists.
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
