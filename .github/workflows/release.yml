name: Release

# Publishes `trsdn-autocut` to PyPI via Trusted Publishing (OIDC), then mirrors
# the release on GitHub with notes taken from CHANGELOG.md.
#
# No API tokens or secrets are used — PyPI is configured with a trusted
# publisher for repository trsdn/autocut, workflow release.yml, environment pypi.
#
# IMPORTANT: this file must stay at `.github/workflows/release.yml`. The path is
# registered as the trusted publisher on pypi.org, so renaming it breaks OIDC.
#
# Trigger a release by pushing a tag: git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs before `publish`, because a PyPI upload cannot be undone: a version
  # number can only ever be used once, so a bad tag has to fail *before* it
  # reaches the index, not after.
  #
  # This is a separate job rather than extra steps inside `publish` so the
  # ordering is enforced by the job graph and cannot be broken by reordering
  # steps. The job itself is deliberately not gated on `refs/tags/*`: a skipped
  # job counts as skipped for anything that `needs:` it, which would silently
  # skip `publish` too. The individual steps carry the tag condition instead.
  verify:
    name: Verify release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # A tag that disagrees with pyproject.toml uploads the wrong version
      # number, and that upload is permanent.
      - name: Verify the tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PROJECT_VERSION="$(python -c '
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])
          ')"
          if [ "${TAG#v}" != "$PROJECT_VERSION" ]; then
            echo "::error::Tag $TAG does not match pyproject.toml version $PROJECT_VERSION."
            exit 1
          fi
          echo "Releasing $PROJECT_VERSION"

      # The github-release job needs these notes. Without this check, a tag with
      # no CHANGELOG section would publish to PyPI and only then fail to build
      # the release — leaving a published version with no release to point at.
      - name: Verify CHANGELOG has release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: python .github/scripts/release_notes.py "$TAG" > /dev/null

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build, verify]
    runs-on: ubuntu-latest
    # Only a tag push publishes. A manual workflow_dispatch run stops after
    # `verify` and `build`, which makes it a safe dry run: it exercises the
    # metadata checks and the build without touching PyPI.
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Runs only after a successful publish, so a GitHub Release can never point at
  # a version that is not actually on PyPI. A skipped `publish` (workflow_dispatch)
  # skips this too, which keeps a manual run a genuine dry run.
  github-release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    # Job-scoped on purpose: the workflow-level block stays at `contents: read`,
    # so `publish` keeps exactly the permissions it has today. Only this job can
    # write releases, and it is issued no OIDC token.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Already validated by `verify`; this is where the notes are produced.
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: python .github/scripts/release_notes.py "$TAG" > release-notes.md

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Re-runnable: update in place when the release already exists, so
          # re-running a failed workflow does not error out.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --verify-tag
          fi
